  # ツール
  intl: ^0.19.0
  flutter_local_notifications: ^20.1.0
  url_launcher: ^6.2.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true